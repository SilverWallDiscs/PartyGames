name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: Download previous JAR only if schematic is missing
        if: ${{ !hashFiles('src/main/resources/horserace.schem') }}
        uses: actions/download-artifact@v6
        with:
          name: PartyGames-e5b5db9de8c20ce1823eee8640779eb1edcdd446
          path: legacy-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 40439844736
      - name: Restore schematic if missing
        if: ${{ !hashFiles('src/main/resources/horserace.schem') }}
        run: |
          set -euo pipefail
          jar_file=""
          while IFS= read -r candidate; do
            if unzip -Z1 "$candidate" 2>/dev/null | grep -qx 'horserace.schem'; then
              jar_file="$candidate"
              break
            fi
          done < <(find legacy-artifact -type f -name '*.jar')
          if [ -z "$jar_file" ]; then
            echo "No JAR in the previous artifact contains horserace.schem"
            find legacy-artifact -type f -print
            exit 1
          fi
          mkdir -p src/main/resources
          unzip -p "$jar_file" horserace.schem > src/main/resources/horserace.schem
          test "$(wc -c < src/main/resources/horserace.schem)" -eq 7779
          echo "Restored horserace.schem from $jar_file ($(wc -c < src/main/resources/horserace.schem) bytes)"
      - name: Commit recovered schematic into main repository
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && hashFiles('src/main/resources/horserace.schem') != ''
        run: |
          set -euo pipefail
          if ! git ls-files --error-unmatch src/main/resources/horserace.schem >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/main/resources/horserace.schem
            git commit -m "Bundle Horse Race schematic as a project resource"
            git push
          fi
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Build
        run: gradle build --no-daemon
      - name: Verify schematic is bundled in mod JAR
        run: |
          set -euo pipefail
          jar_file="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$jar_file"
          unzip -l "$jar_file" | grep -E '[[:space:]]horserace\.schem$'
      - name: Upload mod JAR
        uses: actions/upload-artifact@v7
        with:
          name: PartyGames-${{ github.sha }}
          path: build/libs/*.jar
