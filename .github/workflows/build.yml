name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java 25 and Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Build
        run: gradle build --no-daemon
      - name: Upload mod JAR
        uses: actions/upload-artifact@v7
        with:
          name: PartyGames-${{ github.sha }}
          path: build/libs/*.jar
